networks:
  open-webui-internal: {}

services:
  ollama:
    tty: true
    image: ollama/ollama:${OLLAMA_IMAGE_VERSION:-latest}
    restart: unless-stopped
    platform: ${PLATFORM_ARCH:-linux/amd64}
    pull_policy: always
    container_name: ollama

    networks:
      - open-webui-internal

    volumes:
      - './services/open-webui/ollama/:/root/.ollama'

    labels:
      ## Traefik
      traefik.enable: false

  open-webui:
    image: openwebui/open-webui:${OPEN_WEBUI_IMAGE_VERSION:-slim}
    restart: unless-stopped
    platform: ${PLATFORM_ARCH:-linux/amd64}
    pull_policy: always
    container_name: open-webui

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-}

    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3456/health || exit 1"]
    #   start_period: 40s
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

    depends_on:
      - ollama

    networks:
      - server
      - open-webui-internal

    volumes:
      - './services/open-webui/data/:/app/backend/data'

    labels:
      ## Traefik
      traefik.enable: true

      traefik.http.services.openwebui.loadbalancer.server.port: 8080

      traefik.http.routers.openwebui.entrypoints: web,websecure
      traefik.http.routers.openwebui.service: Open WebUI
      traefik.http.routers.openwebui.rule: Host(`${OPEN_WEBUI_HOST:-chat.${SITE:-localhost}}`)

      ## Homepage
      homepage.group: Web
      homepage.name: Open WebUI
      homepage.icon: openwebui.png
      homepage.href: https://${OPEN_WEBUI_HOST:-chat.${SITE:-localhost}}
      homepage.description: User-friendly AI Interface.
