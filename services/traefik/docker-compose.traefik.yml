services:
  traefik:
    image: traefik:${TRAEFIK_IMAGE_VERSION:-v2.9}
    restart: unless-stopped
    platform: ${PLATFORM_ARCH:-linux/amd64}
    container_name: traefik

    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 10s
      retries: 5

    networks:
      - server
      - server-metrics

    command:
      ## Providers
      - '--providers.docker'
      - '--providers.docker.exposedbydefault=${TRAEFIK_DOCKER_EXPOSED_BY_DEFAULT:-false}'
      - '--providers.docker.network=${TRAEFIK_DOCKER_NETWORK:-server}'
      - '--providers.file'
      - '--providers.file.directory=/dynamic/'
      - '--providers.file.watch=true'

      ## Entrypoints
      - '--entrypoints.web.address=:${TRAEFIK_WEB_ENTRYPOINT:-80}'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'

      - '--entrypoints.websecure.address=:${TRAEFIK_WEBSECURE_ENTRYPOINT:-443}'

      # - '--entrypoints.syncthing-tcp.address=:${TRAEFIK_SYNCTHING_ENTRYPOINT:-22000}/tcp'
      # - '--entrypoints.syncthing-tcp.observability.accessLogs=false'
      # - '--entrypoints.syncthing-tcp.observability.metrics=false'
      # - '--entrypoints.syncthing-tcp.observability.tracing=false'

      # - '--entrypoints.syncthing-udp.address=:${TRAEFIK_SYNCTHING_ENTRYPOINT:-22000}/udp'
      # - '--entrypoints.syncthing-udp.observability.accessLogs=false'
      # - '--entrypoints.syncthing-udp.observability.metrics=false'
      # - '--entrypoints.syncthing-udp.observability.tracing=false'

      # - '--entrypoints.syncthing-relaysrv.address=:${TRAEFIK_SYNCTHING_RELAYSRV_ENTRYPOINT:-22067}/tcp'
      # - '--entrypoints.syncthing-relaysrv.observability.accessLogs=false'
      # - '--entrypoints.syncthing-relaysrv.observability.metrics=false'
      # - '--entrypoints.syncthing-relaysrv.observability.tracing=false'

      # - '--entrypoints.syncthing-relaysrv-status.address=:${TRAEFIK_SYNCTHING_RELAYSRV_STATUS_ENTRYPOINT:-22070}/tcp'
      # - '--entrypoints.syncthing-relaysrv-status.observability.accessLogs=false'
      # - '--entrypoints.syncthing-relaysrv-status.observability.metrics=false'
      # - '--entrypoints.syncthing-relaysrv-status.observability.tracing=false'

      # - '--entrypoints.grpc.address=:${TRAEFIK_GRPC_ENTRYPOINT:-33060}'

      ## Enable HTTP/3
      - '--experimental.http3=true'
      - '--entryPoints.websecure.http3'
      - '--entrypoints.websecure.http3.advertisedPort=${TRAEFIK_WEBSECURE_ENTRYPOINT:-443}'

      ## Let's Encrypt
      - '--certificatesresolvers.letsEncrypt.acme.email=${ROOT_EMAIL:-changeme@changeme.org}'
      - '--certificatesresolvers.letsEncrypt.acme.tlschallenge=true'
      - '--certificatesresolvers.letsEncrypt.acme.storage=/acme.json'
      - '--entrypoints.websecure.http.tls.certresolver=letsEncrypt'

      ## Logs
      - '--accesslog.filepath=/logs/access.log'
      - '--accesslog.format=json'
      - '--log.filepath=/logs/traefik.log'
      - '--log.format=json'
      - '--log.level=${TRAEFIK_LOG_LEVEL:-ERROR}'
      - '--metrics.prometheus'

      ## Misc
      - '--api.dashboard'
      - '--entrypoints.websecure.http.middlewares=compress@file,headers@file${TRAEFIK_PLUGINS:-}'
      - '--global.checknewversion=${TRAEFIK_CHECK_NEW_VERSION:-false}'
      - '--global.sendanonymoususage=${TRAEFIK_SEND_ANONYMOUS_USAGE:-false}'
      - '--ping'

      ## Plugins
      - '--experimental.plugins.fail2ban.modulename=github.com/tommoulard/fail2ban'
      - '--experimental.plugins.fail2ban.version=${TRAEFIK_FAIL2BAN_VERSION:-v0.8.3}'

    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '${USERS_FILE:-./.shadow}:/.shadow:ro'
      - './services/traefik/logs:/logs'
      - './services/traefik/dynamic:/dynamic'
      - './services/traefik/acme.json:/acme.json'

    labels:
      ## Traefik
      traefik.enable: true

      traefik.http.routers.traefik.entrypoints: web,websecure
      traefik.http.routers.traefik.middlewares: shadow_auth@docker
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_HOST:-traefik.${SITE:-localhost}}`)

      ## Middleware definitions
      traefik.http.middlewares.shadow_auth.basicauth.usersfile: /.shadow
      traefik.http.middlewares.shadow_auth.basicauth.removeHeader: true

      ## Homepage
      homepage.group: System
      homepage.name: Traefik
      homepage.icon: traefik.png
      homepage.href: https://${TRAEFIK_HOST:-traefik.${SITE:-localhost}}
      homepage.description: Traefik is an open-source Edge Router that makes publishing your services a fun and easy experience.

      homepage.widget.type: traefik
      homepage.widget.url: https://${TRAEFIK_HOST:-traefik.${SITE:-localhost}}
      homepage.widget.username: ${HOMEPAGE_TRAEFIK_USERNAME}
      homepage.widget.password: ${HOMEPAGE_TRAEFIK_PASSWORD}

    ports:
      - '${TRAEFIK_WEB_ENTRYPOINT:-80}:${TRAEFIK_WEB_ENTRYPOINT:-80}'
      - '${TRAEFIK_WEBSECURE_ENTRYPOINT:-443}:${TRAEFIK_WEBSECURE_ENTRYPOINT:-443}'
      # - '${TRAEFIK_SYNCTHING_ENTRYPOINT:-22000}:${TRAEFIK_SYNCTHING_ENTRYPOINT:-22000}/tcp' ## Syncthing TCP file transfers
      # - '${TRAEFIK_SYNCTHING_ENTRYPOINT:-22000}:${TRAEFIK_SYNCTHING_ENTRYPOINT:-22000}/udp' ## Syncthing QUIC file transfers
      # - '${TRAEFIK_SYNCTHING_RELAYSRV_ENTRYPOINT:-22067}:${TRAEFIK_SYNCTHING_RELAYSRV_ENTRYPOINT:-22067}/tcp' ## Syncthing relay server
      # - '${TRAEFIK_SYNCTHING_RELAYSRV_STATUS_ENTRYPOINT:-22070}:${TRAEFIK_SYNCTHING_RELAYSRV_STATUS_ENTRYPOINT:-22070}/tcp' ## Syncthing relay server status
      # - '${TRAEFIK_GRPC_ENTRYPOINT:-33060}:${TRAEFIK_GRPC_ENTRYPOINT:-33060}'
