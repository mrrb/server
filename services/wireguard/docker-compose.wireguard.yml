services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    platform: ${PLATFORM_ARCH:-linux/amd64}
    container_name: wireguard

    environment:
      WG_HOST: ${WIREGUARD_HOST:-wireguard.${SITE:-localhost}}
      WG_PORT: ${WIREGUARD_PORT:-51820}

      WG_ALLOWED_IPS: '${WIREGUARD_ALLOWEDIPS:-0.0.0.0/0, ::/0}'

      # PASSWORD:
      # WG_DEFAULT_ADDRESS:
      # WG_DEFAULT_DNS:
      # WG_MTU: 1420

    networks:
      server:
      wireguard:
        ipv4_address: 10.21.42.1
        ipv6_address: fdcc:ab21:cd42:ef84::1

    volumes:
      - ./services/wireguard/config:/etc/wireguard
      - /lib/modules:/lib/modules:ro

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

    labels:
      ## Traefik
      traefik.enable: true

      traefik.http.services.wireguard.loadbalancer.server.port: 51821

      traefik.http.routers.wireguard.entrypoints: web,websecure
      traefik.http.routers.wireguard.middlewares: shadow_auth@docker
      traefik.http.routers.wireguard.service: wireguard
      traefik.http.routers.wireguard.rule: Host(`${WIREGUARD_HOST:-wireguard.${SITE:-localhost}}`)

      ## Homepage
      homepage.group: System
      homepage.name: Wireguard
      homepage.icon: wireguard.png
      homepage.href: https://${WIREGUARD_HOST:-wireguard.${SITE:-localhost}}
      homepage.description: Extremely simple yet fast and modern VPN.

    ports:
      - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
